<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffb366"/>
      <stop offset="0.5" stop-color="#ff5a36"/>
      <stop offset="1" stop-color="#c97bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#c97bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c97bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e0d10"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>
  <!-- disco de acreção (atrás, arco superior) -->
  <ellipse cx="32" cy="30" rx="24" ry="8.5" fill="none" stroke="url(#disk)" stroke-width="4.5" stroke-linecap="round" transform="rotate(-14 32 32)" stroke-dasharray="76 76" stroke-dashoffset="-12"/>
  <!-- sombra -->
  <circle cx="32" cy="32" r="12.5" fill="#000"/>
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="#fff2df" stroke-width="1.1" opacity="0.85"/>
  <!-- disco (frente, arco inferior) -->
  <ellipse cx="32" cy="34" rx="24" ry="8.5" fill="none" stroke="url(#disk)" stroke-width="5" stroke-linecap="round" transform="rotate(-14 32 32)" stroke-dasharray="60 92" stroke-dashoffset="64"/>
  <!-- estrelas -->
  <circle cx="12" cy="14" r="1.1" fill="#ffe9c9"/>
  <circle cx="52" cy="10" r="0.9" fill="#cfd8ff"/>
  <circle cx="55" cy="50" r="1" fill="#ffe9c9"/>
  <circle cx="9" cy="49" r="0.8" fill="#cfd8ff"/>
</svg>
